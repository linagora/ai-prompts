name: Prompts Evaluation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Email dataset to evaluate (small|large)'
        default: large

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-node@v6.2.0
        with:
          node-version: 24
      - run: npm install
      - name: Run evaluation
        run: npm run eval-ci
        env:
          OPENAI_API_HOST: ${{ secrets.OPENAI_API_HOST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GENERATION_MODEL_ID: ${{ secrets.GENERATION_MODEL_ID }}
          JUDGE_MODEL_ID: ${{ secrets.JUDGE_MODEL_ID }}
          EVAL_CONCURRENCY: 8
          # PRs run the small dataset as a fast gate; manual runs evaluate the
          # full large dataset.
          EMAIL_DATASET: ${{ github.event_name == 'pull_request' && 'small' || github.event.inputs.dataset || 'large' }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-results
          path: |
            results.json
            report.html
